name: Historia work history update
description: Refresh a work history data repository and push the results to its GitHub Project board.

branding:
  icon: book-open
  color: yellow

inputs:
  username:
    description: GitHub username whose activity should be tracked.
    required: true
  project-url:
    description: URL of the GitHub Project v2 to keep up to date.
    required: true
  token:
    description: >-
      Personal access token that fetches the activity and updates the project board: a fine-grained
      token for a board owned by an organization, or a classic `project`-scoped token for a board
      owned by a user account. See the README. It never pushes: the checkout and pushes use the
      workflow's own `GITHUB_TOKEN`, so the job needs `contents: write`.
    required: true
  recency:
    description: Number of most recent days to fetch. Smart updating still applies.
    required: false
    default: "2"
  directory:
    description: Directory within the repository that holds the collected JSON files.
    required: false
    default: history
  placeholder:
    description: Days after an item's creation date to use as the placeholder end date while it is still open.
    required: false
    default: "180"
  archive-branch:
    description: >-
      Orphan branch to force-push a `content.tar.gz` of the collected data to, for distribution over
      the GitHub CDN. Set to an empty string to skip the archive entirely.
    required: false
    default: dist
  commit-message:
    description: Message for the commits holding each run's new content and the records populating rewrites.
    required: false
    default: update
  rate-limit-label:
    description: >-
      Label of the issue that tracks runs hitting the GitHub API rate limit. The issue opens on the first
      such run, gets a comment on each one after it, and closes on the next run that is not rate limited.
      It needs `issues: write`. Set to an empty string to skip it.
    required: false
    default: historia-rate-limit

outputs:
  rate-limited:
    description: >-
      `true` when the GitHub API rate limit was hit while fetching, so some days were not saved, and `false`
      otherwise. The run still succeeds either way.
    value: ${{ steps.update.outputs.rate-limited }}

runs:
  using: composite
  steps:
    # The checkout persists this token in the git config, so every `git push` below uses it too.
    - name: Check out the data repository
      uses: actions/checkout@v7
      with:
        token: ${{ github.token }}

    - name: Configure git identity
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Update work history data
      id: update
      uses: CodyCBakerPhD/historia-action/update-github@v6
      with:
        directory: ${{ inputs.directory }}
        username: ${{ inputs.username }}
        recency: ${{ inputs.recency }}
        token: ${{ inputs.token }}

    # The update runs in a container as root, so the files it wrote are root-owned and the steps
    # below, which run as the unprivileged runner user, could not otherwise commit them.
    - name: Restore workspace ownership
      shell: bash
      run: sudo chown -R "$(id -u):$(id -g)" .

    - name: Commit and push new content
      shell: bash
      env:
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        git add .
        git diff --quiet --cached || git commit --message "$COMMIT_MESSAGE"
        git push

    # A rate limit is transient, so the run itself succeeds and commits what it fetched. The issue is what
    # makes a limit that keeps recurring visible. Tracking never fails the run, since the data is the point.
    - name: Track rate limiting
      if: inputs.rate-limit-label != '' && steps.update.outputs.rate-limited != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LABEL: ${{ inputs.rate-limit-label }}
        RATE_LIMITED: ${{ steps.update.outputs.rate-limited }}
        USERNAME: ${{ inputs.username }}
      run: |
        marker="<!-- historia-rate-limit -->"
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        today=$(date -u +%F)
        skip() {
          echo "::warning title=Rate limit tracking skipped::$1 Grant the job \`issues: write\`, or set \`rate-limit-label\` to an empty string."
          exit 0
        }

        open_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --limit 1 \
          --json number --jq '.[0].number // empty') || skip "Could not list the issues."

        if [ "$RATE_LIMITED" = "true" ] && [ -z "$open_issue" ]; then
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --force --color FBCA04 \
            --description "Historia runs are hitting the GitHub API rate limit" || skip "Could not create the label."
          body="$marker
        @${USERNAME}, the scheduled Historia run on ${today} hit the GitHub API rate limit, so some days were not saved. [See the run](${run_url}).

        The run still succeeded and committed everything it did fetch. Each later run fetches again the missing days that fall inside its \`recency\` window, so a limit that passes leaves no gap. A day that falls out of the window while the limit lasts stays missing.

        Each run that hits the limit again adds a comment here, and the next run that does not closes this issue."
          gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
            --title "Historia runs are hitting the GitHub API rate limit" --body "$body" || skip "Could not open the issue."
        elif [ "$RATE_LIMITED" = "true" ]; then
          earlier=$(gh issue view "$open_issue" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq "[.comments[] | select(.body | contains(\"$marker\"))] | length") || skip "Could not read the issue."
          body="$marker
        The run on ${today} hit the rate limit again. That makes $((earlier + 2)) runs in a row. [See the run](${run_url})."
          gh issue comment "$open_issue" --repo "$GITHUB_REPOSITORY" --body "$body" || skip "Could not comment on the issue."
        elif [ -n "$open_issue" ]; then
          gh issue close "$open_issue" --repo "$GITHUB_REPOSITORY" \
            --comment "The run on ${today} finished without hitting the rate limit. [See the run](${run_url})." \
            || skip "Could not close the issue."
        fi

    - name: Populate the GitHub project
      uses: CodyCBakerPhD/historia-action/project-populate@v6
      with:
        directory: ${{ inputs.directory }}
        url: ${{ inputs.project-url }}
        placeholder: ${{ inputs.placeholder }}
        token: ${{ inputs.token }}

    # Populating rewrites the records of items that moved since they were recorded. The new content was
    # committed before it, so a failed populate cannot cost it. The container runs as root, but it only
    # rewrites files that already exist, which keeps their owner, so nothing needs reclaiming first.
    - name: Commit and push rewritten records
      shell: bash
      env:
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        git add .
        git diff --quiet --cached || git commit --message "$COMMIT_MESSAGE"
        git push

    - name: Push the compressed archive
      if: inputs.archive-branch != ''
      uses: CodyCBakerPhD/dist-bundle-action@v1
      with:
        paths: ${{ inputs.directory }}
        branch: ${{ inputs.archive-branch }}

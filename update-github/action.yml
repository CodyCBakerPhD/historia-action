name: Historia update GitHub data
description: Fetch a GitHub user's recent activity into a data directory using a pinned Historia container.

inputs:
  directory:
    description: Directory to save the data to, relative to the workspace root.
    required: true
  username:
    description: GitHub username to fetch information about.
    required: true
  recency:
    description: Number of most recent days to fetch. Smart updating still applies.
    required: false
    default: "2"
  token:
    description: GitHub token used to authenticate API requests.
    required: true

outputs:
  rate-limited:
    description: >-
      `true` when the GitHub API rate limit was hit, so some days were not saved, and `false` otherwise.
      The run still succeeds, so a later step has to act on this to notice.

runs:
  using: docker
  image: docker://ghcr.io/codycbakerphd/historia:0.15.0
  env:
    GITHUB_TOKEN: ${{ inputs.token }}
  args:
    - update
    - github
    - --directory
    - ${{ inputs.directory }}
    - --username
    - ${{ inputs.username }}
    - --recency
    - ${{ inputs.recency }}

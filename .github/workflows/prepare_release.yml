name: Prepare release draft

# A release cut by hand asks for a tag name, and the answer is already in the repository: `VERSION`.
# Typing it again is where `v1` came to be cut on a tree whose composite still called its siblings
# by `@v0`.
#
# This keeps a draft release whose tag name and target are taken from `VERSION` and `main`, so
# releasing is opening the prepared draft and pressing Publish. The tag is created from the stored
# name, so there is nothing left to mistype. Nothing here can stop a release typed in by hand
# instead, but it removes the reason to type one.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the tag this tree is published under
        id: resolve
        run: |
          TAG=$(tr -d '[:space:]' < VERSION)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "This tree is published as $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when that tag already exists
        id: released
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists. Moving it is a deliberate act, so nothing is prepared here." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The changelog is GitHub's own, the same one the "Generate release notes" button asks for,
      # rather than a `git log` reformatted here. It reads the pull requests between the two points,
      # so it says what changed rather than how it was committed.
      - name: Write the notes from what has landed since the last release
        id: notes
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          IMAGE=$(python3 -c "import re,pathlib; print(re.search(r'image: docker://(\S+)', pathlib.Path('update-github/action.yml').read_text()).group(1))")
          # The bound is the last published release, asked for rather than left to the API default,
          # which keeps it correct if a prerelease is ever cut in between.
          PREVIOUS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -n "${PREVIOUS}" ]; then
            CHANGELOG=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=${TAG}" -f "target_commitish=${GITHUB_SHA}" -f "previous_tag_name=${PREVIOUS}" --jq .body)
            echo "Changelog since ${PREVIOUS}." >> "$GITHUB_STEP_SUMMARY"
          else
            # With no release yet there is no previous tree anyone could be pinned to, so the
            # changelog reaches back to the first commit.
            CHANGELOG=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=${TAG}" -f "target_commitish=${GITHUB_SHA}" --jq .body)
            echo "No previous release, so the changelog covers everything." >> "$GITHUB_STEP_SUMMARY"
          fi
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          # The pinned image is a property of the tag rather than of whatever Historia released, so
          # the notes say what the release runs as well as what changed in it.
          printf '# %s\n\nActions published as `%s`, running `%s`.\n\n%s\n' \
            "${TAG}" "${TAG}" "${IMAGE}" "${CHANGELOG}" > "${NOTES_FILE}"
          echo "file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Prepare the draft
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES_FILE"
            echo "Updated the existing draft for $TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES_FILE"
            echo "Created a draft for $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Nobody watches a draft that was never prepared, so a failure here is silent until the next
  # release is cut and the draft is missing.
  NotifyOnFailure:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [Draft]
    if: ${{ always() && needs.Draft.result == 'failure' }}

    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: Historia Action Release Draft"
          to: cody.c.baker.phd@gmail.com
          from: Historia <historia@users.noreply.github.com>
          body: "The release draft workflow failed, please check status at https://github.com/CodyCBakerPhD/historia-action/actions/workflows/prepare_release.yml"

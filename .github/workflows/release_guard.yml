name: Release guard

# `VERSION` is what every reference in the repository is checked against, but nothing outside the
# repository knows it. This is the half that pre-commit cannot cover: at commit time the tag does
# not exist yet, so only a release can compare the two.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to check the repository against, e.g. v1"
        required: true

jobs:
  Guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the tag being released
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check the tag against VERSION
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          # A tag may carry a minor and patch (`v1.2.3`), but its major is what the references name.
          MAJOR="v$(printf '%s' "${TAG#v}" | cut -d. -f1)"
          echo "Tag:     $TAG"
          echo "VERSION: $VERSION"
          if [ "$MAJOR" != "$VERSION" ]; then
            echo "::error::Tag $TAG has major $MAJOR, but VERSION says $VERSION. Every reference in this repository names $VERSION, so a release under $TAG would ship references to a different tag. Bump VERSION and re-cut the tag."
            exit 1
          fi
          echo "Tag and VERSION agree on $VERSION ✓"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check every reference names that tag
        run: |
          python -m pip install --upgrade pip pytest pyyaml
          pytest tests/test_actions.py --quiet

name: Rebuild Historia docs

# The tutorial in CodyCBakerPhD/historia names whichever tag of this repository was published most
# recently, looked up when its docs are built. Read the Docs only builds them on a push to that
# repository, so without this a new tag stays out of the tutorial until something unrelated lands
# there.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  Rebuild:
    permissions: {}
    runs-on: ubuntu-latest

    steps:
      # `latest` on Read the Docs tracks `main`, so building that branch rebuilds the docs readers
      # land on.
      - name: Trigger a Read the Docs build of the latest docs
        env:
          READ_THE_DOCS_WEBHOOK_URL: ${{ secrets.READ_THE_DOCS_WEBHOOK_URL }}
          READ_THE_DOCS_WEBHOOK_TOKEN: ${{ secrets.READ_THE_DOCS_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$READ_THE_DOCS_WEBHOOK_URL" ] || [ -z "$READ_THE_DOCS_WEBHOOK_TOKEN" ]; then
            echo "::error::Set the READ_THE_DOCS_WEBHOOK_URL and READ_THE_DOCS_WEBHOOK_TOKEN secrets from the Historia project's Read the Docs integration."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --request POST \
            --data "branches=main" --data "default_branch=main" --data "token=$READ_THE_DOCS_WEBHOOK_TOKEN" \
            "$READ_THE_DOCS_WEBHOOK_URL"

  # A failed trigger leaves the tutorial naming the previous tag with nothing to show for it, so it
  # needs to be noticed.
  NotifyOnFailure:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [Rebuild]
    if: ${{ always() && needs.Rebuild.result == 'failure' }}

    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: Historia Docs Rebuild"
          to: cody.c.baker.phd@gmail.com
          from: Historia <historia@users.noreply.github.com>
          body: "The Historia docs rebuild after a release failed, please check status at https://github.com/CodyCBakerPhD/historia-action/actions/workflows/rebuild_historia_docs.yml"

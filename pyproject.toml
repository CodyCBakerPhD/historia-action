[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ai_generated: mark test as AI-generated",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Docstring style: prefer the D213 / D211 conventions
    "D203",
    "D212",
    # `tests/` is deliberately not a Python package
    "INP001",
]

[tool.ruff.lint.per-file-ignores]
# Tests rely on `assert` (S101) and omit per-module/per-function docstrings (D100, D103)
"tests/**/*.py" = ["S101", "D100", "D103"]
